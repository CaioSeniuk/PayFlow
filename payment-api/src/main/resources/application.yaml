spring:
  application:
    name: payment-api
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:payflow}
    representation:
      uuid: standard
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

payflow:
  demo-merchant:
    enabled: false
