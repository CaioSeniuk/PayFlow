name: payflow

services:
  payment-api:
    image: ${PAYMENT_API_IMAGE:-payflow/payment-api:dev}
    build:
      context: ./payment-api
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your Atlas connection string}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-payflow}
      PAYFLOW_DEMO_MERCHANT_ENABLED: "true"
      PAYFLOW_DEMO_MERCHANT_API_KEY: ${DEMO_MERCHANT_API_KEY:?Set DEMO_MERCHANT_API_KEY in .env}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
